<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-1">Redefinir senha</h1>
                        <p class="text-muted mb-4">Informe seu e-mail. Se existir uma conta associada, enviaremos as instrucoes.</p>

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label" for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
                                {{ form.email }}
                                {{ form.email.errors }}
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Enviar instrucoes</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="{% url 'login' %}" class="text-decoration-none">Voltar para o login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
