<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrucoes enviadas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-2">Verifique seu e-mail</h1>
                        <p class="text-muted mb-4">Se existir uma conta associada ao e-mail informado, voce recebera as instrucoes para redefinir sua senha.</p>
                        <a href="{% url 'login' %}" class="btn btn-dark w-100">Voltar para o login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
