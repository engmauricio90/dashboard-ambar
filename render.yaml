services:
  # Render Cron Job manual recomendado:
  # schedule: */5 * * * *
  # command: python scripts/acionar_automacao_social.py
  # env: PLATFORM_BASE_URL + SOCIAL_AUTOMATION_CRON_SECRET
  - type: web
    runtime: python
    name: dashboard-ambar
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput --settings=config.settings.prod
    startCommand: python manage.py migrate --noinput --settings=config.settings.prod && python manage.py ensure_superuser --settings=config.settings.prod && gunicorn config.wsgi:application --worker-class gthread --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz/
    disk:
      name: dashboard-ambar-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: POSTGRES_CONN_MAX_AGE
        value: "60"
      - key: POSTGRES_SSL_REQUIRE
        value: "True"
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: LOGIN_RATE_LIMIT_WINDOW
        value: "300"
      - key: PASSWORD_RESET_RATE_LIMIT
        value: "5"
      - key: PASSWORD_RESET_RATE_LIMIT_WINDOW
        value: "3600"
      - key: INVITE_RATE_LIMIT
        value: "20"
      - key: INVITE_RATE_LIMIT_WINDOW
        value: "3600"
      - key: PLATFORM_BASE_URL
        value: https://dashboard-ambar.onrender.com
      - key: INSTAGRAM_API_VERSION
        value: v23.0
      - key: INSTAGRAM_EXPECTED_USERNAME
        value: lailapistola
      - key: INSTAGRAM_MEDIA_URL_TTL_SECONDS
        value: "3600"
      - key: INSTAGRAM_API_TIMEOUT_SECONDS
        value: "30"
      - key: SOCIAL_AUTOMATION_QUEUE_MIN
        value: "40"
      - key: SOCIAL_AUTOMATION_QUEUE_TARGET
        value: "60"
      - key: SOCIAL_AUTOMATION_GENERATION_BATCH
        value: "5"
      - key: SOCIAL_AUTOMATION_MIN_POST_GAP_MINUTES
        value: "30"
      - key: SOCIAL_AUTOMATION_MAX_RETRIES
        value: "3"
      - key: SOCIAL_AUTOMATION_HARD_24H_CAP
        value: "30"
      - key: SOCIAL_REEL_MAX_FILE_MB
        value: "20"
      - key: SOCIAL_REEL_DURATION_SECONDS
        value: "7"
      - key: SOCIAL_REEL_RENDER_TIMEOUT_SECONDS
        value: "30"
      - key: SOCIAL_AUTOMATION_CRON_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-ambar-db
          property: connectionString

databases:
  - name: dashboard-ambar-db
    plan: free
    region: oregon
